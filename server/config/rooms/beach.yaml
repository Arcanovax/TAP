import:
  - "market.yaml"   # exit North

room:
  beach:
    name: "Tranquil Azure Playa"
    description: "Calm azure water laps at warm, pale sand. The only sound beyond the waves is an old man in the shade of a rock, muttering secrets he has almost certainly already forgotten."
    exits:
      North: "room.market"
    npc:
      - "npc.old_man"

npc:
  old_man:
    name: "Enigmatix"
    dialog:
      default:
        - "The tide takes what it takes, and gives what it gives... mostly seaweed."
        - "I once knew a great secret. I've forgotten it — but I'm certain it was great."
      quest.lostbook.0:
        - "A page, you say? Loose leaf, ink still smug with secrets? The tide brought one in — days ago. Or was it a gull. Ask the one who watches stories for a living; he devours endings the way the sea devours sandcastles."
      quest.threat.2:
        - "Down to the mine, are you? Heh. The goblins are fleas on a sleeping dog. It's what they GUARD you should fear — it was old when the mine was young, and it does not like to be woken."
        - "...What was I saying? Ah. Lovely weather."
    kind: Citizen
