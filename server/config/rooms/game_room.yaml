import:
  - "tavern.yaml"   # exit South

room:
  game_room:
    name: "The Ace Play"
    description: "A smoky, strictly 18-and-over den of green-felt tables and the soft rattle of dice. At the back, a pink curtain conceals another room entirely — sadly inaccessible without the DLC."
    exits:
      South: "room.tavern"
    npc:
      - "npc.dealer"

npc:
  dealer:
    name: "Donnetonfrix"
    dialog:
      default:
        - "Welcome, welcome! Did you know that 100% of winners played? Be one of them by playing one of my two games:"
        - "SLOT_MACHINE — five gold a pull. Line up a combo and an item is yours; miss, and I thank you for the generous donation."
        - "DICES — also five gold. I'm going to roll 10 ten-sided dice. You can bet on the numbers that will come up for as many dice as you want. If all your predicted numbers are rolled, you win your bet multiplied by the number of predictions"
      quest.percentage.0:
       - "Guess your chances of winning if you play my dice game and place a bet on only two dice. For example, if you think you have a 100% chance of winning, just answer '100'"
      quest.percentage.1:
       - "Guess your chances of winning if you play my dice game and place a bet on only two dice. For example, if you think you have a 100% chance of winning, just answer '100'"
      quest.percentage.2:
        - "Exactly! You're amazing! You won this wonderful golden token! What now? Want to play a quick dice game?"
    kind: Citizen
    quest: "quest.percentage"

quest:
  percentage:
    name: "Win rate"
    description: "Find the answer."
    reward: "item.golden_token"
    goals:
      - Talk:
          dialog: "npc.dealer.dialog.quest.percentage.0"
      - Answer:
          answer: "25"
          room: "room.game_room"
      - Talk:
          dialog: "npc.dealer.dialog.quest.percentage.2"