import:
  - "quarry.yaml"        # exit North
  - "forest.yaml"        # exit East
  - "parc.yaml"          # exit South
  - "city_square.yaml"   # exit West
  - "../items/weapons.yaml"   # inventaire de blacksmith
  - "../items/armors.yaml"    # inventaire + reward quest.tempering (breastplate)
  - "../items/potions.yaml"   # quest.tempering : ale (goal)

room:
  blacksmiths_shop:
    name: "Tongs, Anvils & Pincers"
    description: "The clang of hammer on red-hot steel rings out without pause, answered by the hiss of a fresh blade plunged into cold water and the roar of the bellows feeding the flames. It is hot, deafening, and thick with the smell of iron and ambition."
    exits:
      North: "room.quarry"
      East: "room.forest"
      South: "room.parc"
      West: "room.city_square"
    npc:
      - "npc.blacksmith"

npc:
  blacksmith:
    name: "Métallurgix"
    dialog:
      default:
        - "“Have kids,” they used to say!"
        - "We spend more time worrying about them than loving them!"
      quest.search.0:
        - "My son? I know what everyone says. But I assure you, he would never have given up his job just to pursue a little fling."
        - "But it's true that lately he's been spending more time in the mountains than at the blacksmith's shop!"
        - "You could start your research there."
      quest.tempering.1:
        - "You brought the ale! Perfect. Forget water — a blade quenched in a good amber holds its edge AND a fine bouquet. Here, this breastplate is yours. 'Plot Armor,' I call it: never seen a hero die in one."
    kind:
      Merchant:
        gold: 45
        inventory:
          - "item.sword"
          - "item.shield"
          - "item.helmet"
          - "item.dagger"
          - "item.breastplate"
    quest: "quest.tempering"

quest:
  tempering:
    name: "A Fine Tempering"
    description: "Métallurgix swears a blade quenched in good ale outlasts one cooled in mere water. Bring him an amber beer from the pub to prove it."
    reward: "item.breastplate"
    goals:
      - Collect:
          item: "item.ale"
          amount: 1
      - Retrieve:
          item: "item.ale"
          amount: 1
          dialog: "npc.blacksmith.dialog.quest.tempering.1"
