import:
  - "blacksmith.yaml"   # exit North
  - "market.yaml"       # exit West (+ dialog quest.lostbook.1 sur citizen_4)
  - "beach.yaml"        # quest.lostbook : dialog quest.lostbook.0 (old_man)
  - "../items/armors.yaml"   # quest.lostbook : helmet (reward)

room:
  parc:
    name: "The Amazing Parc"
    description: "Children tear across the lawns under their parents' half-watchful eyes, while a quiet reading corner offers refuge to anyone who would rather turn a page than dodge a stray football."
    exits:
      North: "room.blacksmiths_shop"
      West: "room.market"
    npc:
      - "npc.bookseller"
      - "npc.citizen_5"
      - "npc.citizen_6"

npc:
  bookseller:
    name: "Damducédéix"
    dialog:
      default:
        - "A book, traveler? For your evenings by the fire."
        - "Young people don't read anymore. It's a disaster."
      quest.lostbook.2:
        - "You found it — my missing final page! Maybe I should be less judgmental about movies. Some of them are probably really good."
    kind: Citizen
    quest: "quest.lostbook"

  citizen_5:
    name: "Iwanttobreakfrix"
    dialog:
      default:
        - "Do you know my friend Frédimercurix?"
        - "Great singer!"
    kind: Citizen

  citizen_6:
    name: "Soirénetflix"
    dialog:
      default:
        - "Kids these days will come up with anything just to get attention. Back in my day, this wouldn't have happened!"
        - "The guard will tell you more."
    kind: Citizen

quest:
  lostbook:
    name: "The Missing Page"
    description: "Damducédéix has lost the final page of his favourite book. Track down who might have seen it: ask the muttering old man on the beach, then the film buff at the market."
    reward: "item.helmet"
    goals:
      - Talk:
          dialog: "npc.old_man.dialog.quest.lostbook.0"
      - Talk:
          dialog: "npc.citizen_4.dialog.quest.lostbook.1"
      - Talk:
          dialog: "npc.bookseller.dialog.quest.lostbook.2"
