locations:
  start:
    name: "Village Square"
    description: "A bustling square with cobblestone paths."
    exits:
      - North: 
         toward: "tavern"
      - East: 
         toward: "shop"
    npc:
      gard:
        name: "Village Guard"
        description: "A stern-looking guard watching over the square."
        dialogue: ["Stay safe, traveler.", "The roads can be dangerous."]
        kind: Gard
  tavern:
    name: "The Prancing Pony"
    description: "A cozy tavern filled with warmth and laughter."
    exits:
      - South:
         toward: "start"
    npc:
      Bar_owner:
        name: "Bar owner"
        description: "A friendly bar owner eager to trade."
        dialogue: ["Welcome to my shop!", "What can I get for you today?"]
        kind:
          Merchant:
            gold: 45
            inventory:
              - name: "Ale"
                price: 10
                number: 15
                kind:
                  Potion:
                    healing: 15

  shop:
    name: "General Store"
    description: "Shelves lined with various goods and supplies."
    exits:
      - West:
         toward: "start"
    npc:
      merchant:
        name: "Shop Keeper"
        description: "A friendly merchant eager to trade."
        dialogue: ["Welcome to my shop!", "What can I get for you today?"]
        kind:
          Merchant:
            gold: 45
            inventory:
              - name: "sword"
                price: 45
                number: 2
                kind:
                  Weapon:
                    damages: 10

